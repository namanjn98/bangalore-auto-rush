<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Auto Raja">
  <title>Auto Raja: Bangalore Rush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <div id="route-map" aria-label="Route progress">
      <div class="route-segment">CUBBON</div>
      <div class="route-segment">MG RD</div>
      <div class="route-segment">KORA</div>
      <div class="route-segment">ECITY</div>
      <div class="route-segment">YELA</div>
      <div id="route-marker" aria-hidden="true"></div>
      <div id="route-finish" aria-hidden="true">FINISH</div>
    </div>
    <div id="canvas-stage">
      <canvas id="gameCanvas" width="800" height="380"></canvas>

      <div id="ui-overlay">
        <div id="speed-display">SPD <span id="speed-value">3.0</span></div>
        <div id="score-display">SCORE <span id="score-value">0</span></div>
        <div id="zone-banner" class="hidden">CUBBON PARK</div>
        <div id="acid-warning" class="hidden">⚡ ACID TRIP ⚡</div>
        <div id="power-indicator" class="hidden"></div>
      </div>
    </div>

    <div id="power-controls-panel">
      <div id="power-status-row">
        <span id="power-label">POWER CONTROLS</span>
        <span id="power-help">fills with time</span>
      </div>
      <button class="note-slot" id="note-horn" type="button">
        <span class="power-fill"></span>
        <span class="power-label">HORN</span>
      </button>
    </div>

    <div id="start-screen">
      <div id="start-title">AUTO RAJA</div>
      <div id="start-sub">BANGALORE RUSH</div>
      <div id="start-story">
        Tap jump. Time the horn. Survive Bangalore traffic.
      </div>
      <div id="controls-box">
        <div class="preview-route">JUMP over people, vehicles, and road hazards</div>
        <div class="preview-power-row">
          <span>BRAKE</span>
          <span>HORN</span>
          <span>LIGHTS</span>
        </div>
        <div class="preview-jump">JUMP</div>
      </div>
      <button id="start-btn">TAP TO PLAY</button>
    </div>

    <div id="gameover-screen" class="hidden">
      <div id="gameover-title">GAME OVER</div>
      <div id="gameover-score">SCORE: <span id="final-score">0</span></div>
      <div id="best-score-row">BEST: <span id="best-score">0</span></div>
      <div id="gameover-msg"></div>
      <div id="gameover-actions">
        <button id="retry-btn" type="button">PLAY AGAIN</button>
        <button id="share-btn" type="button">SHARE SCORE</button>
      </div>
      <div id="share-status" aria-live="polite"></div>
    </div>

    <div id="touch-controls" aria-label="Mobile controls">
      <button id="touch-brake" class="touch-btn touch-power" type="button">
        <span class="power-fill"></span>
        <span class="touch-label">BRAKE</span>
        <span class="power-countdown"></span>
      </button>
      <button id="touch-horn" class="touch-btn touch-power" type="button">
        <span id="horn-bar-fill" class="power-fill"></span>
        <span class="touch-label">HORN</span>
        <span class="power-countdown"></span>
      </button>
      <button id="touch-lights" class="touch-btn touch-power" type="button">
        <span class="power-fill"></span>
        <span class="touch-label">LIGHTS</span>
        <span class="power-countdown"></span>
      </button>
      <button id="touch-jump" class="touch-btn touch-jump" type="button">
        <span class="touch-label">JUMP</span>
      </button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
